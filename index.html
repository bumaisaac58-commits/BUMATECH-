<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MwalimuEase Offline</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="login-body">
<div class="login-card">
  <div class="logo">ME</div>
  <h1>MwalimuEase</h1>
  <p class="muted">Offline School Management System</p>
  <form id="loginForm">
    <label>Username</label><input id="username" value="admin" required>
    <label>Password</label><input id="password" type="password" value="admin123" required>
    <button class="btn primary" type="submit">Sign in</button>
  </form>
  <p class="hint">Default login: <b>admin</b> / <b>admin123</b></p>
</div>
<script src="js/database.js"></script>
<script src="js/app.js"></script>
<script>
document.getElementById('loginForm').addEventListener('submit', e=>{
  e.preventDefault();
  if(document.getElementById('username').value==='admin' && document.getElementById('password').value==='admin123'){
    localStorage.setItem('mw_logged_in','1'); location.href='dashboard.html';
  } else alert('Incorrect username or password.');
});
</script>
</body></html>
